# =============================================================================
# Nginx Reverse Proxy Anti-Shodan untuk JETCYBERNET SmartOLT
# 1. Scan langsung ke IP publik (contoh: http://103.42.242.7) -> LANGSUNG DROP (444)
#    sehingga Shodan tidak mendapat banner HTTP / fingerprint Node.js / Express.
# 2. Akses aplikasi HANYA lewat nama domain dengan HTTPS + TLS 1.2/1.3.
# 3. Backend berjalan privat di 127.0.0.1:3006 (tidak terbuka ke internet).
#
# ALTERNATIF PALING AMAN (ZERO OPEN PORTS di Shodan):
# Gunakan Cloudflare Tunnel (`cloudflared`) menunjuk ke `http://127.0.0.1:3006`
# lalu tutup port 80 & 443 di UFW — Shodan tidak akan melihat port website maupun DB!
# =============================================================================

# Blokir total semua request yang langsung menembak IP server (Shodan/bot scanner)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# Redirect HTTP domain -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name olt.domainanda.com;
    return 301 https://$host$request_uri;
}

# HTTPS Production Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name olt.domainanda.com;

    # Ganti dengan path sertifikat Let's Encrypt (certbot) atau Cloudflare Origin Cert
    ssl_certificate     /etc/letsencrypt/live/olt.domainanda.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/olt.domainanda.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Sembunyikan versi Nginx & header backend
    server_tokens off;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # Batasi ukuran body upload (sesuai backup JSON 10.000 ONU)
    client_max_body_size 64m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 30s;
    }
}
